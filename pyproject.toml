[project]
name = "pca9685-debugging-panel"
version = "0.1.0"
description = "Web-based remote control panel for debugging PCA9685 servo drivers on robots."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "adafruit-blinka>=9.1.0",
    "adafruit-circuitpython-servokit>=1.3.24",
    "fastapi>=0.136.3",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
pca9685-panel = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.wheel.force-include]
"frontend" = "frontend"
"main.py" = "main.py"
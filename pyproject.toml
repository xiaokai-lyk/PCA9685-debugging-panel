[project]
name = "pca9685-debugging-panel"
version = "0.2.1"
description = "Web-based remote control panel for debugging PCA9685 servo drivers on robots."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Yunkai Li"},
]
keywords = ["pca9685", "servo", "debugging", "robot", "i2c", "pwm", "web-panel", "fastapi", "adafruit-blinka"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "adafruit-blinka>=9.1.0",
    "adafruit-circuitpython-servokit>=1.3.24",
    "fastapi>=0.136.3",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.48.0",
]

[project.urls]
Repository = "https://github.com/xiaokai-lyk/PCA9685-debugging-panel"
Issues = "https://github.com/xiaokai-lyk/PCA9685-debugging-panel/issues"

[project.scripts]
pca9685-panel = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.wheel.force-include]
"frontend" = "frontend"
"main.py" = "main.py"